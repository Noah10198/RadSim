<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(128,128)">
    <!-- 黄色底圆：半径 126 + 描边 4 → 外缘正好 128，填满 256×256 -->
    <circle cx="0" cy="0" r="126" fill="#FFD700" stroke="#000" stroke-width="4"/>

    <!-- 三个黑色扇叶（坐标按 126/120 = 1.05 倍缩放） -->
    <g>
      <!-- 顶部扇叶 -->
      <path d="M -21,-36.372 L -63,-109.116 A 126,126 0 0,1 63,-109.116 L 21,-36.372 A 42,42 0 0,0 -21,-36.372 Z" fill="#000"/>
      <!-- 右下扇叶 -->
      <path d="M -21,-36.372 L -63,-109.116 A 126,126 0 0,1 63,-109.116 L 21,-36.372 A 42,42 0 0,0 -21,-36.372 Z" fill="#000" transform="rotate(120)"/>
      <!-- 左下扇叶 -->
      <path d="M -21,-36.372 L -63,-109.116 A 126,126 0 0,1 63,-109.116 L 21,-36.372 A 42,42 0 0,0 -21,-36.372 Z" fill="#000" transform="rotate(240)"/>
    </g>

    <!-- 中心黑圆：半径 42，与内弧一致 -->
    <circle cx="0" cy="0" r="42" fill="#000"/>
  </g>
</svg>