# =============================================================================
#  RadSim —— 新建环境的干净定义（原 environment.yml 保持不动，另存为本文件）
#
#  用法：
#      conda env create -f environment.new.yml
#      conda activate radsim
#      python main.py
#
#  ── 为什么另写一份 ───────────────────────────────────────────────────────────
#  environment.yml 是 `conda list --export` 快照：每条都带 win-64 构建号
#  （h88e836f_209 之类）外加 vc / ucrt / vs2015_runtime / mkl，只能在那一台
#  Windows 机器上复现，Linux 上直接无解。本文件只写直接依赖，构建号交给
#  solver 按平台重解。
#
#  ── 关键修复：Qt 单源 ────────────────────────────────────────────────────────
#  原环境里同时存在两份 Qt6 运行时：
#      conda  qt6-main   6.8.3   ← VTK 的 Qt 模块链接它
#      pip    pyqt6-qt6  6.4.3   ← PyQt6 自带
#  同名 Qt6*.dll 一个进程只能加载一份，先 import PyQt6 再 import
#  vtkmodules.vtkRenderingQt 必然失败：
#      ImportError: DLL load failed while importing vtkRenderingQt
#  这里改成 PyQt6 由 conda-forge 提供，和 VTK 共用同一个 qt6-main。
#
#  版本约束依据（实测 conda-forge 元数据）：
#      pyqt6    6.8.1  requires  qt6-main >=6.8.1,<6.9.0a0
#      vtk-base 9.3.1  requires  qt6-main >=6.7.3,<6.9.0a0
#  交集 = qt6-main 6.8.x，两边同时满足。
#  ⚠ pyqt6 必须钉 6.8.1：放开会解到 6.11.0，它要求 qt6-main >=6.11，与 vtk 冲突。
#
#  ── 另外几点 ─────────────────────────────────────────────────────────────────
#  * vtk 钉 `qt_*` 构建：occt 的 all 变体依赖 vtk，若让 solver 自由选，可能落到
#    osmesa 变体（离屏渲染），RadSim 的窗口就画不出来。
#  * 不再依赖 pip 的 pyqt6-tools / qt6-applications（仓库里没有 .ui 文件，界面
#    全是手写 Python），少下几百 MB。
#  * occt / pythonocc-core 保留：RadSim 代码零引用，但套件其它程序需要，
#    环境要统一（见 doc/11-linux-porting.md 8.1）。
#
#  注意：QVTKOpenGLNativeWidget 在 Python 侧不存在——VTK 上游没有这个包装，
#        pip wheel 与 conda 包里都没有，因此本环境仍用 QVTKRenderWindowInteractor。
# =============================================================================

name: radsim-env

channels:
  - conda-forge
  - nodefaults          # 不与 defaults 混用，避免 channel 优先级把 Qt 解乱

dependencies:
  - python=3.10
  - pip

  # --- Qt：全环境唯一一份，由 conda-forge 提供 ---
  - pyqt6=6.8.1          # 必须钉死，它决定 qt6-main 落在 6.8.x

  # --- 渲染 ---
  - vtk=9.3.1=qt_*       # qt 变体：屏幕渲染 + 与 pyqt6 共用同一 qt6-main
  - numpy
  - matplotlib           # ui/probe_chart_dialog.py

  # --- OCC：RadSim 零引用，为套件统一保留 ---
  - occt=7.9.0=all_*
  - pythonocc-core=7.9.0=all_*

  # --- 以下三个 RadSim 零引用，只为套件统一保留；只跑 RadSim 时保持注释 ---
  # 若启用，务必用 conda-forge 版本：pip install pyvista 会再拉一份 pip vtk
  # 覆盖掉 conda 的 vtk，Qt 冲突和渲染后端问题都会跟着回来。
  # - gmsh
  # - pyvista
  # - pyqtgraph
